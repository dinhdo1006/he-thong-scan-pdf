services:

  # =========================
  # NIFI
  # =========================
  nifi:
    image: apache/nifi:1.25.0
    container_name: nifi
    restart: always

    depends_on:
      - kafka
      - minio

    ports:
      - "8443:8443"

    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_PROXY_HOST: localhost:8443,192.168.8.80:8443

      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: Admin@123456

    networks:
      - ocr-network

  # =========================
  # MINIO
  # =========================
  minio:
    image: minio/minio
    container_name: minio
    restart: always

    command: server /home --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Admin@123

    volumes:
      - ./home/minio:/home

    networks:
      - ocr-network

  # =========================
  # KAFKA
  # =========================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: always

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    volumes:
      - ./home/kafka:/var/lib/kafka/home

    networks:
      - ocr-network

  # =========================
  # PREPROCESS
  # =========================
  preprocess:
    build: ./Preprocess_service
    image: preprocess-local
    container_name: preprocess
    restart: always
    ports:
      - "5000:5000"
    networks:
      - ocr-network

  # =========================
  # LAYOUT DETECTOR WORKER
  # =========================
  layout_detector:
    build: ./layout_detector
    image: layout-detector-local
    container_name: layout-detector-worker
    restart: always
    depends_on:
      - kafka
      - minio
    environment:
      - KAFKA_BROKER=kafka:9092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=Admin@123
      - ENABLE_ROBOFLOW_TABLES=0
    networks:
      - ocr-network

  # =========================
  # VIETOCR WORKER (CPU MODE)
  # =========================
  vietocr:
    build: ./vietocr
    image: vietocr-worker-cpu
    container_name: vietocr-worker
    restart: always
    depends_on:
      - kafka
      - minio
    environment:
      - KAFKA_BROKER=kafka:9092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=Admin@123
    volumes:
      # Put vgg_seq2seq.pth here (from old ocr_pipeline/vietocr/weights)
      - ./vietocr/weights:/app/weights:ro
    networks:
      - ocr-network

  # =========================
  # OCR RECONSTRUCTION WORKER
  # =========================
  ocr_reconstruction:
    build: ./ocr_reconstruction_2
    image: ocr-reconstruction-local
    container_name: reconstruct-worker
    restart: always
    depends_on:
      - kafka
      - minio
    environment:
      - KAFKA_BROKER=kafka:9092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=Admin@123
      - RECONSTRUCT_TIMEOUT=120
      - MINIO_BUCKET=data-lake
    networks:
      - ocr-network

  # =========================
  # TABLE EXTRACT (pdf_extractor)
  # =========================
  table_extract:
    build:
      context: ../..
      dockerfile: ocr_pipeline_backup/ocr_pipeline/table_extract/Dockerfile
    image: table-extract-local
    container_name: table-extract-worker
    restart: always
    depends_on:
      - kafka
      - minio
    environment:
      - KAFKA_BROKER=kafka:9092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=Admin@123
      - MINIO_BUCKET=data-lake
      - TABLE_EXTRACT_BACKEND=paddle
      # CUDA_VISIBLE_DEVICES=
    networks:
      - ocr-network

  # =========================
  # MERGE
  # =========================
  merge:
    build: ./merge
    image: merge-worker-local

    container_name: merge-worker

    restart: always

    depends_on:
      - kafka
      - minio

    environment:
      KAFKA_BROKER: kafka:9092

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: Admin@123
      MERGE_REQUIRE_TABLES: "1"
      MERGE_TIMEOUT_S: "600"

    networks:
      - ocr-network

  # =========================
  # DOCX EXPORTER WORKER
  # =========================
  convert_to_docx:
    build: ./convert_to_docx
    image: convert-to-docx-local
    container_name: docx-worker
    restart: always
    depends_on:
      - kafka
      - minio
    environment:
      - KAFKA_BROKER=kafka:9092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=Admin@123
      - MINIO_BUCKET=data-lake
    networks:
      - ocr-network

networks:
  ocr-network:
    driver: bridge
